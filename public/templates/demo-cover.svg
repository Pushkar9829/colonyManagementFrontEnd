<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="600" viewBox="0 0 1600 600">
  <!-- Demo cover picture for the seeded colonies (generated, no photo rights involved). -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7cb7e8"/>
      <stop offset="0.6" stop-color="#cfe4f2"/>
      <stop offset="1" stop-color="#f6e7cf"/>
    </linearGradient>
    <linearGradient id="tower" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e9e4dc"/>
      <stop offset="1" stop-color="#cfc6b8"/>
    </linearGradient>
    <linearGradient id="tower2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d9cfc2"/>
      <stop offset="1" stop-color="#b9ad9d"/>
    </linearGradient>
    <pattern id="win" width="34" height="38" patternUnits="userSpaceOnUse">
      <rect x="7" y="8" width="18" height="20" rx="2" fill="#8fb3cf"/>
      <rect x="7" y="8" width="18" height="6" fill="#b8d3e6"/>
    </pattern>
  </defs>
  <rect width="1600" height="600" fill="url(#sky)"/>
  <circle cx="1280" cy="140" r="70" fill="#fff3c4" opacity="0.9"/>
  <g fill="#ffffff" opacity="0.75">
    <ellipse cx="260" cy="110" rx="120" ry="26"/>
    <ellipse cx="330" cy="96" rx="80" ry="24"/>
    <ellipse cx="980" cy="80" rx="140" ry="22"/>
  </g>
  <!-- back towers -->
  <g>
    <rect x="120" y="190" width="200" height="410" fill="url(#tower2)"/>
    <rect x="132" y="205" width="176" height="395" fill="url(#win)" opacity="0.7"/>
    <rect x="1330" y="170" width="190" height="430" fill="url(#tower2)"/>
    <rect x="1342" y="185" width="166" height="415" fill="url(#win)" opacity="0.7"/>
    <rect x="760" y="210" width="170" height="390" fill="url(#tower2)"/>
    <rect x="772" y="225" width="146" height="375" fill="url(#win)" opacity="0.7"/>
  </g>
  <!-- front towers -->
  <g>
    <rect x="360" y="120" width="250" height="480" fill="url(#tower)"/>
    <rect x="374" y="138" width="222" height="462" fill="url(#win)"/>
    <rect x="350" y="108" width="270" height="18" fill="#b4a794"/>
    <rect x="980" y="140" width="260" height="460" fill="url(#tower)"/>
    <rect x="994" y="158" width="232" height="442" fill="url(#win)"/>
    <rect x="970" y="128" width="280" height="18" fill="#b4a794"/>
  </g>
  <!-- garden -->
  <rect y="520" width="1600" height="80" fill="#6f9e5a"/>
  <g fill="#4f8443">
    <circle cx="80" cy="515" r="46"/>
    <circle cx="300" cy="520" r="40"/>
    <circle cx="680" cy="512" r="52"/>
    <circle cx="930" cy="522" r="38"/>
    <circle cx="1290" cy="514" r="48"/>
    <circle cx="1560" cy="520" r="42"/>
  </g>
  <g fill="#3f6f35">
    <circle cx="130" cy="532" r="34"/>
    <circle cx="720" cy="535" r="36"/>
    <circle cx="1330" cy="534" r="34"/>
  </g>
  <rect x="640" y="560" width="320" height="40" fill="#d8c9a8"/>
</svg>
