<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline · ColonyHub</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f8fafc; color: #334155; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
      main { max-width: 22rem; padding: 2rem; text-align: center; }
      h1 { font-size: 1.25rem; color: #0f172a; }
      button { margin-top: 1rem; border: 0; border-radius: .5rem; background: #4f46e5; color: #fff; padding: .6rem 1.2rem; font-size: .9rem; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icon-192.png" alt="" width="64" height="64" />
      <h1>You're offline</h1>
      <p>ColonyHub needs a connection. Check your internet and try again.</p>
      <button onclick="location.reload()">Retry</button>
    </main>
  </body>
</html>
